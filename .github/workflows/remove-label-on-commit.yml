name: Remove run-tests label on new commit

on:
  pull_request:
    types: [synchronize]

jobs:
  remove-label:
    runs-on: ubuntu-latest
    steps:
      - name: Remove run-tests label if present
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            if (labels.includes('run-tests')) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'run-tests'
              });
              console.log('Removed run-tests label - new commit pushed');
            } else {
              console.log('No run-tests label to remove');
            }
