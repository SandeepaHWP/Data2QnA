name: Listen for /run-tests comment

on:
  issue_comment:
    types: [created]

jobs:
  trigger:
    if: >-
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/run-tests') &&
      contains(fromJson('["SandeepaHWP"]'), github.event.comment.user.login)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: write
      pull-requests: read
    steps:
      - name: Acknowledge comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Trigger tests workflow
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number
            });

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'tests.yml',
              ref: pr.data.head.ref
            });
